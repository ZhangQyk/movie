<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIP视频解析</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            z-index: -1;
        }

        .main-wrapper {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
        }

        .container {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            padding: 32px 24px;
            width: 100%;
            max-width: 480px;
            margin-bottom: 20px;
            animation: fadeInUp 0.5s ease-out;
            transition: all 0.3s ease;
        }

        .container.expanded {
            max-width: 900px;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 26px;
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.3);
        }

        h1 {
            color: #1a202c;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .subtitle {
            color: #718096;
            font-size: 13px;
        }

        .input-section {
            margin-bottom: 16px;
            width: 100%;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #4a5568;
            font-size: 13px;
            font-weight: 600;
        }

        .input-wrapper {
            display: flex;
            gap: 8px;
            width: 100%;
            min-width: 0;
        }

        input[type="text"] {
            flex: 1;
            min-width: 0;
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.4;
            transition: all 0.2s ease;
            outline: none;
            background: #fff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        input[type="text"]:hover {
            border-color: #cbd5e0;
        }

        input[type="text"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input[type="text"]::placeholder {
            color: #a0aec0;
            font-size: 13px;
        }

        .btn-clear {
            flex-shrink: 0;
            padding: 12px 16px;
            background: #edf2f7;
            border: none;
            border-radius: 10px;
            color: #4a5568;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-clear:hover {
            background: #e2e8f0;
        }

        .btn-clear:active {
            transform: scale(0.96);
        }

        .btn-parse {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            position: relative;
            overflow: hidden;
        }

        .btn-parse:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.5);
        }

        .btn-parse:active {
            transform: translateY(0);
        }

        .btn-parse:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .warning {
            text-align: center;
            color: #c53030;
            font-size: 12px;
            font-weight: 500;
            padding: 10px;
            background: #fff5f5;
            border-radius: 8px;
            border: 1px solid #fed7d7;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .tips {
            padding-top: 16px;
            border-top: 1px solid #e2e8f0;
        }

        .tips-title {
            font-size: 11px;
            color: #718096;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tips-list {
            list-style: none;
            font-size: 12px;
            color: #718096;
            line-height: 1.7;
        }

        .tips-list li {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 4px;
        }

        .tips-list li::before {
            content: '';
            width: 4px;
            height: 4px;
            background: #667eea;
            border-radius: 50%;
            margin-top: 7px;
            flex-shrink: 0;
        }

        /* 视频播放器区域 */
        .player-section {
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            padding: 20px;
            display: none;
            animation: slideDown 0.4s ease-out;
        }

        .player-section.show {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e2e8f0;
        }

        .player-title {
            font-size: 16px;
            font-weight: 600;
            color: #1a202c;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .player-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #38a169;
            background: #f0fff4;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid #9ae6b4;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: #38a169;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .btn-close-player {
            background: #edf2f7;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            color: #4a5568;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-close-player:hover {
            background: #e2e8f0;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
        }

        .player-loading {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 10;
            transition: opacity 0.3s;
        }

        .player-loading.hide {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 14px;
            color: #a0aec0;
        }

        /* 安全警告遮罩 */
        .security-blocked {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 20;
            text-align: center;
            padding: 40px;
        }

        .security-blocked.show {
            display: flex;
        }

        .security-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .security-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #fc8181;
        }

        .security-text {
            font-size: 14px;
            color: #a0aec0;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .security-domain {
            background: rgba(102, 126, 234, 0.2);
            padding: 8px 16px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 13px;
            color: #667eea;
            margin-bottom: 20px;
            word-break: break-all;
        }

        .btn-retry {
            padding: 10px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-retry:hover {
            background: #5a67d8;
        }

        /* Toast 提示 */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
            pointer-events: none;
            max-width: 90vw;
            text-align: center;
            line-height: 1.4;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.error {
            background: rgba(197, 48, 48, 0.9);
        }

        /* 输入框错误状态 */
        input.error {
            border-color: #fc8181 !important;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-3px); }
            40%, 80% { transform: translateX(3px); }
        }

        /* 加载状态 */
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .btn-parse.loading .spinner {
            display: block;
        }

        .btn-parse.loading .btn-text {
            display: none;
        }

        /* 移动端优化 */
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }

            .container, .player-section {
                padding: 24px 16px;
                border-radius: 16px;
            }

            h1 {
                font-size: 20px;
            }

            input[type="text"] {
                font-size: 16px;
                padding: 10px 12px;
            }

            .btn-clear {
                padding: 10px 14px;
            }

            .video-wrapper {
                border-radius: 8px;
            }

            .video-wrapper iframe {
                border-radius: 8px;
            }

            .security-blocked {
                padding: 24px;
            }
        }

        @media (max-width: 480px) {
            .player-header {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }

            .btn-close-player {
                align-self: flex-end;
            }
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <div class="container" id="mainContainer">
            <div class="header">
                <div class="logo">🎬</div>
                <h1>VIP视频解析</h1>
                <p class="subtitle">安全播放 · 拒绝广告</p>
            </div>

            <div class="input-section">
                <label for="videoUrl">视频链接</label>
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="videoUrl" 
                        placeholder="粘贴视频播放页链接..."
                        autocomplete="off"
                        autocorrect="off"
                        autocapitalize="off"
                        spellcheck="false"
                    >
                    <button class="btn-clear" onclick="clearInput()">清空</button>
                </div>
            </div>

            <button class="btn-parse" id="parseBtn" onclick="parseVideo()">
                <div class="spinner"></div>
                <span class="btn-text">✨ 立即解析播放</span>
            </button>

            <div class="warning">
                ⚠️ 仅供学习交流使用，请勿用于商业用途
            </div>

            <div class="tips">
                <div class="tips-title">使用步骤</div>
                <ul class="tips-list">
                    <li>打开视频播放页面，复制浏览器地址</li>
                    <li>将链接粘贴到上方输入框</li>
                    <li>点击解析按钮，即可免费观看</li>
                </ul>
            </div>
        </div>

        <div class="player-section" id="playerSection">
            <div class="player-header">
                <div class="player-title">
                    📺 正在播放
                    <span class="player-status">
                        <span class="status-dot"></span>
                        安全模式
                    </span>
                </div>
                <button class="btn-close-player" onclick="closePlayer()">
                    ✕ 关闭播放器
                </button>
            </div>
            <div class="video-wrapper" id="videoWrapper">
                <!-- 加载状态 -->
                <div class="player-loading" id="playerLoading">
                    <div class="loading-spinner"></div>
                    <div class="loading-text">正在加载视频资源...</div>
                </div>
                
                <!-- 安全拦截提示 -->
                <div class="security-blocked" id="securityBlocked">
                    <div class="security-icon">🛡️</div>
                    <div class="security-title">安全拦截</div>
                    <div class="security-text">
                        检测到页面尝试跳转到非授权域名<br>
                        已自动拦截，保护您的浏览安全
                    </div>
                    <div class="security-domain" id="blockedDomain">unknown.com</div>
                    <button class="btn-retry" onclick="retryParse()">重新解析</button>
                </div>
                
                <!-- 视频iframe -->
                <iframe id="videoFrame" sandbox="allow-scripts allow-same-origin allow-forms" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // 允许的域名白名单
        const ALLOWED_DOMAINS = [
            'jx.xmflv.cc',
            'www.jx.xmflv.cc',
            'xmflv.cc'
        ];

        const videoUrlInput = document.getElementById('videoUrl');
        const parseBtn = document.getElementById('parseBtn');
        const toast = document.getElementById('toast');
        const mainContainer = document.getElementById('mainContainer');
        const playerSection = document.getElementById('playerSection');
        const videoFrame = document.getElementById('videoFrame');
        const playerLoading = document.getElementById('playerLoading');
        const securityBlocked = document.getElementById('securityBlocked');
        const blockedDomain = document.getElementById('blockedDomain');

        let currentParseUrl = '';
        let securityCheckInterval = null;

        function showToast(message, type = 'normal') {
            toast.textContent = message;
            toast.className = 'toast show' + (type === 'error' ? ' error' : '');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function clearInput() {
            videoUrlInput.value = '';
            videoUrlInput.classList.remove('error');
            videoUrlInput.focus();
        }

        function validateUrl(url) {
            if (!url) return { valid: false, message: '请输入视频链接' };
            
            if (!/^https?:\/\//i.test(url)) {
                return { valid: false, message: '链接需以 http:// 或 https:// 开头' };
            }
            
            try {
                new URL(url);
                return { valid: true };
            } catch {
                return { valid: false, message: '请输入有效的网址格式' };
            }
        }

        // 检查域名是否在白名单中
        function isAllowedDomain(url) {
            try {
                const urlObj = new URL(url);
                const hostname = urlObj.hostname.toLowerCase();
                return ALLOWED_DOMAINS.some(domain => 
                    hostname === domain || hostname.endsWith('.' + domain)
                );
            } catch {
                return false;
            }
        }

        // 从URL中提取域名
        function extractDomain(url) {
            try {
                return new URL(url).hostname;
            } catch {
                return 'unknown';
            }
        }

        // 启动安全监控
        function startSecurityMonitor() {
            // 清除之前的监控
            if (securityCheckInterval) {
                clearInterval(securityCheckInterval);
            }

            // 定期检查iframe当前URL（通过try-catch防止跨域错误）
            securityCheckInterval = setInterval(() => {
                try {
                    const frameLocation = videoFrame.contentWindow.location;
                    const currentUrl = frameLocation.href;
                    
                    // 如果iframe加载了非白名单域名，立即拦截
                    if (currentUrl && currentUrl !== 'about:blank' && !isAllowedDomain(currentUrl)) {
                        blockNavigation(currentUrl);
                    }
                } catch (e) {
                    // 跨域错误说明跳转到了其他域名，这是不允许的
                    // 尝试通过src判断
                    const src = videoFrame.src;
                    if (src && src !== 'about:blank' && !isAllowedDomain(src)) {
                        blockNavigation(src);
                    }
                }
            }, 1000);
        }

        // 拦截非法跳转
        function blockNavigation(url) {
            const domain = extractDomain(url);
            blockedDomain.textContent = domain;
            securityBlocked.classList.add('show');
            playerLoading.classList.add('hide');
            
            // 重置iframe到安全页面
            videoFrame.src = 'about:blank';
            
            showToast('已拦截非法跳转: ' + domain, 'error');
            console.warn('Security: Blocked navigation to', url);
        }

        // 停止安全监控
        function stopSecurityMonitor() {
            if (securityCheckInterval) {
                clearInterval(securityCheckInterval);
                securityCheckInterval = null;
            }
        }

        function parseVideo() {
            const url = videoUrlInput.value.trim();
            
            const validation = validateUrl(url);
            if (!validation.valid) {
                videoUrlInput.classList.add('error');
                showToast(validation.message, 'error');
                setTimeout(() => videoUrlInput.classList.remove('error'), 500);
                videoUrlInput.focus();
                return;
            }

            parseBtn.classList.add('loading');
            parseBtn.disabled = true;

            // 构建解析URL
            currentParseUrl = 'https://jx.xmflv.cc/?url=' + encodeURIComponent(url);
            
            // 验证解析域名白名单
            if (!isAllowedDomain(currentParseUrl)) {
                showToast('解析服务域名不在白名单中', 'error');
                parseBtn.classList.remove('loading');
                parseBtn.disabled = false;
                return;
            }

            // 显示播放器
            setTimeout(() => {
                // 重置状态
                securityBlocked.classList.remove('show');
                playerLoading.classList.remove('hide');
                
                // 设置iframe
                videoFrame.src = currentParseUrl;
                playerSection.classList.add('show');
                mainContainer.classList.add('expanded');
                
                // 启动安全监控
                startSecurityMonitor();
                
                // 滚动到播放器
                playerSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                
                // 模拟加载完成
                setTimeout(() => {
                    playerLoading.classList.add('hide');
                }, 2000);
                
                parseBtn.classList.remove('loading');
                parseBtn.disabled = false;
                
                showToast('视频加载成功，安全监控已启动');
            }, 600);
        }

        function retryParse() {
            securityBlocked.classList.remove('show');
            playerLoading.classList.remove('hide');
            
            // 重新加载
            videoFrame.src = currentParseUrl;
            
            setTimeout(() => {
                playerLoading.classList.add('hide');
            }, 1500);
        }

        function closePlayer() {
            stopSecurityMonitor();
            playerSection.classList.remove('show');
            mainContainer.classList.remove('expanded');
            videoFrame.src = 'about:blank';
            currentParseUrl = '';
            playerLoading.classList.remove('hide');
            securityBlocked.classList.remove('show');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 监听iframe加载
        videoFrame.addEventListener('load', function() {
            playerLoading.classList.add('hide');
            
            try {
                // 尝试访问location，如果跨域则说明跳转到了其他域名
                const loc = videoFrame.contentWindow.location;
                console.log('Frame loaded:', loc.href);
            } catch (e) {
                // 跨域错误，可能是跳转到了广告页
                console.warn('Cross-origin detected, checking domain...');
            }
        });

        videoUrlInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !parseBtn.disabled) {
                parseVideo();
            }
        });

        videoUrlInput.addEventListener('input', function() {
            this.classList.remove('error');
        });

        videoUrlInput.addEventListener('paste', function(e) {
            setTimeout(() => {
                this.value = this.value.trim();
            }, 0);
        });

        window.addEventListener('load', () => {
            videoUrlInput.focus();
        });

        // ESC键关闭播放器
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && playerSection.classList.contains('show')) {
                closePlayer();
            }
        });

        // 页面卸载时清理
        window.addEventListener('beforeunload', () => {
            stopSecurityMonitor();
        });
    </script>
